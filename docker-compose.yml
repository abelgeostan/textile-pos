services:
  postgres:
    image: postgres:16-alpine
    container_name: textile_pos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos
      POSTGRES_DB: posdb
    # Database is exposed only on the server itself, not publicly.
    ports:
      - "127.0.0.1:18733:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d posdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: textile_pos_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://pos:pos@postgres:5432/posdb
      JWT_SECRET: ${JWT_SECRET:-change-this-before-public-deployment}
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      CORS_ORIGINS: https://textpos.brethren.in,http://localhost:5173
    ports:
      - "18732:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: https://textposback.brethren.in/api
    container_name: textile_pos_frontend
    restart: unless-stopped
    ports:
      - "18731:80"
    depends_on:
      - backend

volumes:
  postgres_data:
